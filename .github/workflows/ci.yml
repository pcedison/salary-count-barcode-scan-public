name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  required-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Verify release readiness
        run: npm run verify:release

      - name: Start disposable loopback PostgreSQL
        # Host networking retains loopback inet_server_addr() for the strict test guard.
        run: |
          docker run --detach --name payroll-test-postgres --network host \
            --env POSTGRES_PASSWORD=postgres \
            postgres:17 -c listen_addresses=127.0.0.1
          for attempt in $(seq 1 30); do
            if docker exec payroll-test-postgres pg_isready -h 127.0.0.1 -U postgres; then
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Prepare fresh loopback payroll databases
        run: |
          docker exec payroll-test-postgres createdb -h 127.0.0.1 -U postgres payroll_test_corrections
          docker exec payroll-test-postgres createdb -h 127.0.0.1 -U postgres payroll_test_backup

      - name: Verify correction transactions against PostgreSQL
        env:
          PAYROLL_CORRECTION_TEST_DB_URL: postgresql://postgres:postgres@127.0.0.1:5432/payroll_test_corrections
          PAYROLL_CORRECTION_TEST_DB_DISPOSABLE: '1'
        run: npm run test:payroll-db

      - name: Verify authoritative payroll backup and restore against PostgreSQL
        env:
          PAYROLL_CORRECTION_TEST_DB_URL: postgresql://postgres:postgres@127.0.0.1:5432/payroll_test_backup
          PAYROLL_CORRECTION_TEST_DB_DISPOSABLE: '1'
        run: npm run test:payroll-backup-db

      - name: Verify LINE receipt transactions against disposable PostgreSQL
        env:
          TEST_ATTENDANCE_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: npx vitest run server/repositories/lineClockInRepository.postgres.test.ts

      - name: Check patch hygiene
        run: git diff --check

      - name: Remove disposable PostgreSQL
        if: always()
        run: |
          if docker container inspect payroll-test-postgres >/dev/null 2>&1; then
            docker rm --force payroll-test-postgres
          fi

  docker-smoke:
    runs-on: ubuntu-latest
    needs: required-checks
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build Docker image
        run: docker build -t salary-scan-ci .

      - name: Start Docker smoke container
        run: |
          docker run -d --rm --name salary-scan-smoke -p 18080:8080 \
            -e NODE_ENV=production \
            -e PAYROLL_WRITES_PAUSED=true \
            -e DATABASE_URL=postgresql://smoke:smoke@db.internal.test:5432/smoke \
            -e SESSION_SECRET=0123456789abcdef0123456789abcdef \
            -e SESSION_SECURE=true \
            -e BACKUP_ENCRYPTION_KEY=abcdef0123456789abcdef0123456789 \
            -e APP_RUNTIME_DIR=/tmp/barcode_scan_V3-runtime \
            -e APP_BACKUP_DIR=/tmp/barcode_scan_V3-runtime/backups \
            -e APP_LOG_DIR=/tmp/barcode_scan_V3-runtime/logs \
            salary-scan-ci

      - name: Probe live endpoint
        run: |
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:18080/live; then
              exit 0
            fi
            sleep 1
          done
          docker logs salary-scan-smoke
          exit 1

      # Explicit local Docker volume bootstrap must hand the child directories to
      # node and drop privileges before starting the app; Cloud Run starts as node.
      - name: Start root-started smoke container with a root-owned volume
        run: |
          docker volume create salary-scan-smoke-data
          docker run -d --rm --name salary-scan-smoke-root --user 0 -p 18081:8080 \
            --mount type=volume,src=salary-scan-smoke-data,dst=/data \
            -e NODE_ENV=production \
            -e PAYROLL_WRITES_PAUSED=true \
            -e DATABASE_URL=postgresql://smoke:smoke@db.internal.test:5432/smoke \
            -e SESSION_SECRET=0123456789abcdef0123456789abcdef \
            -e SESSION_SECURE=true \
            -e BACKUP_ENCRYPTION_KEY=abcdef0123456789abcdef0123456789 \
            -e APP_VOLUME_ROOT=/data \
            -e APP_BACKUP_DIR=/data/backups \
            -e APP_LOG_DIR=/data/logs \
            salary-scan-ci

      - name: Verify the app runs as node with writable volume directories
        run: |
          live=0
          for _ in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:18081/live; then
              live=1
              break
            fi
            sleep 1
          done
          if [ "$live" -ne 1 ]; then
            echo "::error::Root-started container did not answer /live"
            docker logs salary-scan-smoke-root 2>&1 | tail -n 20 | sed 's/^/::error::container log: /'
            exit 1
          fi

          failed=0
          docker exec -i salary-scan-smoke-root sh -s <<'ROOT_CHECKS' || failed=1
          fail=0
          check() { if (eval "$2"); then echo "ok: $1"; else echo "::error::Root-started container check failed: $1"; fail=1; fi; }
          check "PID 1 runs as node" 'test "$(stat -c %U /proc/1)" = node'
          check "PID 1 has no_new_privs" 'grep -Eq "^NoNewPrivs:[[:space:]]+1$" /proc/1/status'
          check "volume root stays root-owned" 'test "$(stat -c %U /data)" = root'
          check "backup dir is owned by node" 'test "$(stat -c %U /data/backups)" = node'
          check "log dir is owned by node" 'test "$(stat -c %U /data/logs)" = node'
          exit "$fail"
          ROOT_CHECKS
          # Reading another user's /proc/<pid>/environ needs the same uid (Docker drops CAP_SYS_PTRACE).
          docker exec -i --user node salary-scan-smoke-root sh -s <<'NODE_CHECKS' || failed=1
          fail=0
          check() { if (eval "$2"); then echo "ok: $1"; else echo "::error::Root-started container check failed: $1"; fail=1; fi; }
          check "PID 1 HOME is /home/node" 'tr "\0" "\n" < /proc/1/environ | grep -qx HOME=/home/node'
          check "default runtime dir is created under /home/node" 'for i in 1 2 3 4 5; do test -d /home/node/.local/state/barcode_scan_V3 && exit 0; sleep 1; done; exit 1'
          check "node can write to the backup dir" 'touch /data/backups/.smoke && rm /data/backups/.smoke'
          exit "$fail"
          NODE_CHECKS
          exit "$failed"

      - name: Stop Docker smoke container
        if: always()
        run: |
          docker rm -f salary-scan-smoke salary-scan-smoke-root || true
          docker volume rm salary-scan-smoke-data || true
