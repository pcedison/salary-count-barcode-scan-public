name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  required-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Verify release readiness
        run: npm run verify:release

      - name: Start disposable loopback PostgreSQL
        # Host networking retains loopback inet_server_addr() for the strict test guard.
        run: |
          docker run --detach --name payroll-test-postgres --network host \
            --env POSTGRES_PASSWORD=postgres \
            postgres:17 -c listen_addresses=127.0.0.1
          for attempt in $(seq 1 30); do
            if docker exec payroll-test-postgres pg_isready -h 127.0.0.1 -U postgres; then
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Prepare fresh loopback payroll databases
        run: |
          docker exec payroll-test-postgres createdb -h 127.0.0.1 -U postgres payroll_test_corrections
          docker exec payroll-test-postgres createdb -h 127.0.0.1 -U postgres payroll_test_backup

      - name: Verify correction transactions against PostgreSQL
        env:
          PAYROLL_CORRECTION_TEST_DB_URL: postgresql://postgres:postgres@127.0.0.1:5432/payroll_test_corrections
          PAYROLL_CORRECTION_TEST_DB_DISPOSABLE: '1'
        run: npm run test:payroll-db

      - name: Verify authoritative payroll backup and restore against PostgreSQL
        env:
          PAYROLL_CORRECTION_TEST_DB_URL: postgresql://postgres:postgres@127.0.0.1:5432/payroll_test_backup
          PAYROLL_CORRECTION_TEST_DB_DISPOSABLE: '1'
        run: npm run test:payroll-backup-db

      - name: Check patch hygiene
        run: git diff --check

      - name: Remove disposable PostgreSQL
        if: always()
        run: |
          if docker container inspect payroll-test-postgres >/dev/null 2>&1; then
            docker rm --force payroll-test-postgres
          fi

  docker-smoke:
    runs-on: ubuntu-latest
    needs: required-checks
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build Docker image
        run: docker build -t salary-scan-ci .

      - name: Start Docker smoke container
        run: |
          docker run -d --rm --name salary-scan-smoke -p 18080:8080 \
            -e NODE_ENV=production \
            -e PAYROLL_WRITES_PAUSED=true \
            -e DATABASE_URL=postgresql://smoke:smoke@db.internal.test:5432/smoke \
            -e SESSION_SECRET=0123456789abcdef0123456789abcdef \
            -e SESSION_SECURE=true \
            -e BACKUP_ENCRYPTION_KEY=abcdef0123456789abcdef0123456789 \
            -e APP_RUNTIME_DIR=/tmp/barcode_scan_V3-runtime \
            -e APP_BACKUP_DIR=/tmp/barcode_scan_V3-runtime/backups \
            -e APP_LOG_DIR=/tmp/barcode_scan_V3-runtime/logs \
            salary-scan-ci

      - name: Probe live endpoint
        run: |
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:18080/live; then
              exit 0
            fi
            sleep 1
          done
          docker logs salary-scan-smoke
          exit 1

      # Railway volumes mount as root and need RAILWAY_RUN_UID=0; the entrypoint must
      # hand the volume directories to node and drop privileges before starting the app.
      - name: Start root-started smoke container with a root-owned volume
        run: |
          docker volume create salary-scan-smoke-data
          docker run -d --rm --name salary-scan-smoke-root --user 0 -p 18081:8080 \
            --mount type=volume,src=salary-scan-smoke-data,dst=/data \
            -e NODE_ENV=production \
            -e PAYROLL_WRITES_PAUSED=true \
            -e DATABASE_URL=postgresql://smoke:smoke@db.internal.test:5432/smoke \
            -e SESSION_SECRET=0123456789abcdef0123456789abcdef \
            -e SESSION_SECURE=true \
            -e BACKUP_ENCRYPTION_KEY=abcdef0123456789abcdef0123456789 \
            -e RAILWAY_VOLUME_MOUNT_PATH=/data \
            -e APP_BACKUP_DIR=/data/backups \
            -e APP_LOG_DIR=/data/logs \
            salary-scan-ci

      - name: Verify the app runs as node with writable volume directories
        run: |
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:18081/live; then
              break
            fi
            if [ "$i" -eq 20 ]; then
              docker logs salary-scan-smoke-root
              exit 1
            fi
            sleep 1
          done
          docker exec salary-scan-smoke-root sh -c '
            set -e
            test "$(stat -c %U /proc/1)" = node
            grep -Eq "^NoNewPrivs:[[:space:]]+1$" /proc/1/status
            tr "\0" "\n" < /proc/1/environ | grep -qx HOME=/home/node
            test "$(stat -c %U /data)" = root
            test "$(stat -c %U /data/backups)" = node
            test "$(stat -c %U /data/logs)" = node
          '

      - name: Stop Docker smoke container
        if: always()
        run: |
          docker rm -f salary-scan-smoke salary-scan-smoke-root || true
          docker volume rm salary-scan-smoke-data || true
